name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Test — bond data validation
        run: node --experimental-vm-modules tests/bonds-data.test.js

      - name: Test — MCT official parser
        run: node --test tests/mct-official-parser.test.mjs

      - name: Test — timezone helpers
        run: node tests/timezone.test.mjs

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax-check Python scripts
        run: python -m py_compile scripts/count-gulf-ships.py &&
             python -m py_compile scripts/extract-health-values.py &&
             python -m py_compile scripts/update-market.py &&
             python -m py_compile scripts/write-health.py &&
             python -m py_compile scripts/append-hormuz.py
