name: Test CME API
on:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch CME
        run: curl -v "https://www.cmegroup.com/CmeWS/mvc/Quotes/Future/424/G" -H "Accept: application/json" -H "User-Agent: Mozilla/5.0" -o /tmp/out.json 2>&1 | tail -5 && cat /tmp/out.json | head -c 300
