name: Test CME API
on:
  workflow_dispatch:
  push:
    branches: ["feat/bond-markets"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dubai crude swap futures
        run: |
          curl -s "https://www.cmegroup.com/CmeWS/mvc/Quotes/Future/424/G" \
            -H "Accept: application/json" \
            -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36" \
            -o /tmp/cme.json
          cat /tmp/cme.json | head -c 500
          python3 -c "
import json, sys
with open('/tmp/cme.json') as f:
    d = json.load(f)
quotes = d.get('quotes', [])
if quotes:
    q = quotes[0]
    print('Last:', q.get('last'), '| Change:', q.get('change'), '| Updated:', q.get('updated'))
else:
    print('No quotes. Keys:', list(d.keys()))
"
