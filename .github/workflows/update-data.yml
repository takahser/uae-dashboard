name: Update Attack Data

on:
  schedule:
    - cron: "0 8 * * *"   # once daily at 08:00 UTC (manual updates preferred)
  workflow_dispatch:           # allow manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # needed to commit data files back to repo
      actions: write           # needed to trigger deploy workflow

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main            # always use latest main

      - name: Pull latest main
        run: git pull origin main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Fetch tweets via Playwright
        run: node .github/scripts/fetch-tweets-playwright.js
        continue-on-error: true

      - name: Fetch DXB flight data (OpenSky)
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
        run: node scripts/fetch-flights.js
        continue-on-error: true

      - name: Fetch MCT/DOH flight data (OpenSky)
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
        run: node scripts/fetch-flights-mct-doh.js
        continue-on-error: true

      - name: Fetch flight data via FR24 (DXB, DWC, AUH, MCT, DOH)
        run: node scripts/fetch-flights-fr24.js
        continue-on-error: true

      - name: Setup Python for health timestamps
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Write health timestamps
        run: |
          pip install requests -q
          python scripts/write-health.py flight_dxb --method flightradar24 --source-url "https://www.flightradar24.com/" || true
          python scripts/write-health.py flight_auh --method flightradar24 --source-url "https://www.flightradar24.com/" || true
          python scripts/write-health.py flight_others --method flightradar24 --source-url "https://www.flightradar24.com/" || true
          UAE_TOTAL=$(python3 -c "import json; d=json.load(open('public/data-uae.json')); c=d.get('cumulative',{}); print(c.get('ballisticDetected',0)+c.get('cruiseDetected',0)+c.get('dronesDetected',0))" 2>/dev/null || echo "")
          BHR_TOTAL=$(python3 -c "import json; d=json.load(open('public/data-bahrain.json')); c=d.get('cumulative',{}); print(c.get('total',c.get('ballisticDetected',0)+c.get('dronesDetected',0)))" 2>/dev/null || echo "")
          KWT_TOTAL=$(python3 -c "import json; d=json.load(open('public/data-kuwait.json')); c=d.get('cumulative',{}); print(c.get('total',c.get('ballisticDetected',0)+c.get('dronesDetected',0)))" 2>/dev/null || echo "")
          IRN_TOTAL=$(python3 -c "import json; d=json.load(open('public/data-iran.json')); c=d.get('cumulative',{}); print(c.get('total',c.get('ballisticDetected',0)+c.get('dronesDetected',0)))" 2>/dev/null || echo "")
          python scripts/write-health.py bahrain_attacks --method twitter-playwright --source-url "https://x.com/" ${BHR_TOTAL:+--new-value "$BHR_TOTAL"} || true
          python scripts/write-health.py iran_data --method twitter-playwright --source-url "https://x.com/" ${IRN_TOTAL:+--new-value "$IRN_TOTAL"} || true
          python scripts/write-health.py kuwait_attacks --method twitter-playwright --source-url "https://x.com/" ${KWT_TOTAL:+--new-value "$KWT_TOTAL"} || true
          python scripts/write-health.py uae_attacks --method twitter-playwright --source-url "https://x.com/" ${UAE_TOTAL:+--new-value "$UAE_TOTAL"} || true

      - name: Commit updated data files (if changed)
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data-*.json .github/scripts/tweet-cache/*.json public/health/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: update attack data"
            git pull --rebase origin main
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"ref": "main"}' \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy-pages.yml/dispatches"
