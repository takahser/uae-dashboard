name: Grok Data Review

on:
  pull_request:
    branches: [main]
    paths:
      - 'public/data-uae.json'
      - 'public/data-market.json'
      - 'public/data-bonds.json'
      - 'public/data-substitution.json'
      - 'src/data/energy-attacks.json'
      - 'src/data/electrical-threats.json'
      - 'src/data/hormuz.json'

jobs:
  grok-data-review:
    runs-on: ubuntu-latest
    # Only run on PRs from the same repo (not forks) — protects LLM_SESSION
    if: ${{ secrets.LLM_SESSION != '' && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Run Grok data review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LLM_SESSION: ${{ secrets.LLM_SESSION }}
        run: node scripts/grok-review.js
