name: Update Market Data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Count Gulf ships (AIS)
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: |
          pip install websockets
          python scripts/count-gulf-ships.py > /tmp/gulf-ships.json || echo '{"ships":null,"tankers":null}' > /tmp/gulf-ships.json
          cat /tmp/gulf-ships.json

      - name: Fetch market data
        run: |
          pip install requests
          python - <<'PYEOF'
          import requests, json, time, os
          from datetime import datetime, timezone

          SYMBOLS = ["BZ=F", "CL=F", "NG=F", "2222.SR", "FRO", "STNG", "RTX", "LMT"]
          NAMES = {
              "BZ=F": "Brent Crude",
              "CL=F": "WTI Crude",
              "NG=F": "Natural Gas",
              "2222.SR": "Saudi Aramco",
              "FRO": "Frontline",
              "STNG": "Scorpio Tankers",
              "RTX": "RTX Corp",
              "LMT": "Lockheed Martin",
          }
          EIA_KEY = "SWpk1JtQ4j8iB6FAHUOnT1LS88T6uCHhTbeMJbgO"  # free rate-limited EIA key

          quotes = {}
          history = {}

          for sym in SYMBOLS:
              try:
                  # Quote data via v8 chart API (1d range, 1d interval = latest quote)
                  url = f"https://query1.finance.yahoo.com/v8/finance/chart/{sym}?range=1d&interval=1d"
                  headers = {"User-Agent": "Mozilla/5.0"}
                  r = requests.get(url, headers=headers, timeout=15)
                  r.raise_for_status()
                  chart = r.json()["chart"]["result"][0]
                  meta = chart["meta"]
                  price = meta.get("regularMarketPrice", 0)
                  prev = meta.get("chartPreviousClose", meta.get("previousClose", 0))
                  change = round(price - prev, 2)
                  change_pct = round((change / prev) * 100, 2) if prev else 0

                  quotes[sym] = {
                      "symbol": sym,
                      "name": NAMES.get(sym, sym),
                      "price": round(price, 2),
                      "change": change,
                      "changePercent": change_pct,
                      "previousClose": round(prev, 2),
                  }

                  # 30-day history via v8 chart API
                  hurl = f"https://query1.finance.yahoo.com/v8/finance/chart/{sym}?range=30d&interval=1d"
                  hr = requests.get(hurl, headers=headers, timeout=15)
                  hr.raise_for_status()
                  hchart = hr.json()["chart"]["result"][0]
                  timestamps = hchart.get("timestamp", [])
                  closes = hchart["indicators"]["quote"][0].get("close", [])
                  hist = []
                  for ts, c in zip(timestamps, closes):
                      if c is not None:
                          dt = datetime.fromtimestamp(ts, tz=timezone.utc).strftime("%Y-%m-%d")
                          hist.append({"date": dt, "close": round(c, 2)})
                  history[sym] = hist

                  time.sleep(0.5)
              except Exception as e:
                  print(f"Warning: failed to fetch {sym}: {e}")

          # Load existing data to preserve Dubai history
          import json as _json, os as _os
          existing_data = {}
          if _os.path.exists("public/data-market.json"):
              try:
                  with open("public/data-market.json") as _f:
                      existing_data = _json.load(_f)
              except:
                  pass
          # Dubai Platts crude — CME calendar swap futures via investiny (1-2 day delay)
          # investing_id=1161259 = CME DBLc1 (Dubai Crude Oil Platts Financial Futures)
          # Falls back to preserved manual price if fetch fails
          dubai_existing_quote = existing_data.get("quotes", {}).get("DUBAI", {})
          dubai_history = existing_data.get("history", {}).get("DUBAI", [])
          try:
              import subprocess as _sp, json as _json2
              _r = _sp.run(
                  ["pip", "install", "-q", "investiny"],
                  capture_output=True
              )
              from investiny import historical_data as _hd
              from datetime import datetime as _dt, timedelta as _td
              _today = _dt.now().strftime("%m/%d/%Y")
              _week_ago = (_dt.now() - _td(days=7)).strftime("%m/%d/%Y")
              _data = _hd(investing_id=1161259, from_date=_week_ago, to_date=_today)
              _price = _data["close"][-1]
              _prev = _data["close"][-2] if len(_data["close"]) > 1 else _price
              _change = round(_price - _prev, 2)
              _change_pct = round((_change / _prev) * 100, 2) if _prev else 0
              quotes["DUBAI"] = {
                  "symbol": "DUBAI",
                  "name": "Dubai Crude Oil (Platts Futures)",
                  "price": round(_price, 2),
                  "change": _change,
                  "changePercent": _change_pct,
                  "previousClose": round(_prev, 2),
                  "note": f"CME DBLc1 futures — data as of {_data['date'][-1]}",
                  "source": "investiny/investing.com (1-2 day delay)",
              }
              # Auto-append any new dates to history (deduped by date)
              existing_dates = {e["date"] for e in dubai_history}
              added = 0
              for _d, _c in zip(_data["date"], _data["close"]):
                  _parts = _d.split("/")
                  _iso = f"{_parts[2]}-{_parts[0]}-{_parts[1]}"
                  if _iso not in existing_dates:
                      dubai_history.append({"date": _iso, "close": round(_c, 2)})
                      existing_dates.add(_iso)
                      added += 1
              dubai_history.sort(key=lambda x: x["date"])
              history["DUBAI"] = dubai_history
              print(f"Dubai: CME futures ${round(_price, 2)} (as of {_data['date'][-1]}) — {added} new history entries added")
          except Exception as _e:
              print(f"Dubai CME fetch failed ({_e}), preserving manual price")
              if dubai_existing_quote:
                  quotes["DUBAI"] = dubai_existing_quote
              if dubai_history:
                  history["DUBAI"] = dubai_history

          # Oman crude — manual update only (no free live source available)
          # Update this value manually when @KobeissiLetter or verified sources report a new price
          OMAN_PRICE = 200.0   # Updated Mar 19 2026 — @SprinterPress confirmed $200
          OMAN_PREV  = 154.0   # Mar 18 close per @KobeissiLetter
          quotes["OMAN"] = {
              "symbol": "OMAN",
              "name": "Oman Crude",
              "price": OMAN_PRICE,
              "change": round(OMAN_PRICE - OMAN_PREV, 2),
              "changePercent": round((OMAN_PRICE - OMAN_PREV) / OMAN_PREV * 100, 2),
              "previousClose": OMAN_PREV,
              "note": "DME Oman benchmark — manual update",
              "source": "Manual (SprinterPress Mar 19)",
          }

          # Load Gulf ship count from AIS step
          gulf_ships = {"ships": None, "tankers": None}
          try:
              with open("/tmp/gulf-ships.json") as _f:
                  gulf_ships = _json.load(_f)
          except:
              pass

          output = {
              "updated": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "quotes": quotes,
              "history": history,
              "gulf": {
                  "ships": gulf_ships.get("ships"),
                  "tankers": gulf_ships.get("tankers"),
                  "sampled_at": gulf_ships.get("sampled_at"),
              },
          }

          with open("public/data-market.json", "w") as f:
              json.dump(output, f, indent=2)

          print(f"Updated {len(quotes)} quotes, {len(history)} histories")
          PYEOF

      - name: Append AIS count to hormuz.json
        run: |
          python3 << 'PYEOF'
import json, os
from datetime import datetime, timezone

gulf_file = "/tmp/gulf-ships.json"
hormuz_file = "src/data/hormuz.json"

try:
    with open(gulf_file) as f:
        gulf = json.load(f)
    ships = gulf.get("ships")
    tankers = gulf.get("tankers", 0)
    if ships is None:
        print("No AIS data — skipping hormuz.json update")
        exit(0)
except Exception as e:
    print(f"Could not read gulf ships: {e}")
    exit(0)

today = datetime.now(timezone.utc).strftime("%Y-%m-%d")

with open(hormuz_file) as f:
    data = json.load(f)

existing_dates = {e["date"] for e in data}
if today in existing_dates:
    print(f"hormuz.json already has entry for {today} — skipping")
    exit(0)

data.append({
    "date": today,
    "ships": ships,
    "tankers": tankers,
    "oil_mbpd": 0.0,
    "status": "critical",
    "notes": f"AIS: {ships} vessels detected.",
    "tollPassage": True
})
data.sort(key=lambda x: x["date"])

with open(hormuz_file, "w") as f:
    json.dump(data, f, indent=2)

print(f"hormuz.json: added {today} — ships={ships}, tankers={tankers}")
PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data-market.json public/data-substitution.json src/data/hormuz.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "data: update market + substitution $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
