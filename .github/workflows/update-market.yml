name: Update Market Data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Count Gulf ships (AIS)
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: |
          pip install websockets
          python scripts/count-gulf-ships.py > /tmp/gulf-ships.json || echo '{"ships":null,"tankers":null}' > /tmp/gulf-ships.json
          cat /tmp/gulf-ships.json

      - name: Fetch market data
        run: |
          pip install requests
          python scripts/update-market.py

      - name: Append AIS count to hormuz.json
        run: python3 scripts/append-hormuz.py

      - name: Write health timestamps
        run: |
          for src in brent wti natgas aramco frontline stng rtx lmt dubai oman gulf_ais hormuz_chart; do
            python scripts/write-health.py $src || true
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data-market.json public/data-substitution.json src/data/hormuz.json public/health/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "data: update market + substitution $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase && git push
