name: Update Market Data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Count Gulf ships (AIS)
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: |
          pip install websockets
          python scripts/count-gulf-ships.py > /tmp/gulf-ships.json || echo '{"ships":null,"tankers":null}' > /tmp/gulf-ships.json
          cat /tmp/gulf-ships.json

      - name: Fetch market data
        run: |
          pip install requests
          python scripts/update-market.py
        continue-on-error: true

      - name: Append AIS count to hormuz.json
        run: python3 scripts/append-hormuz.py
        continue-on-error: true

      - name: Write health timestamps
        run: |
          python scripts/write-health.py brent --method yahoo-finance --source-url "https://finance.yahoo.com/quote/BZ=F" || true
          python scripts/write-health.py wti --method yahoo-finance --source-url "https://finance.yahoo.com/quote/CL=F" || true
          python scripts/write-health.py natgas --method yahoo-finance --source-url "https://finance.yahoo.com/quote/NG=F" || true
          python scripts/write-health.py aramco --method yahoo-finance --source-url "https://finance.yahoo.com/quote/2222.SR" || true
          python scripts/write-health.py frontline --method yahoo-finance --source-url "https://finance.yahoo.com/quote/FRO" || true
          python scripts/write-health.py stng --method yahoo-finance --source-url "https://finance.yahoo.com/quote/STNG" || true
          python scripts/write-health.py rtx --method yahoo-finance --source-url "https://finance.yahoo.com/quote/RTX" || true
          python scripts/write-health.py lmt --method yahoo-finance --source-url "https://finance.yahoo.com/quote/LMT" || true
          python scripts/write-health.py dubai --method oilprice-scrape --source-url "https://oilprice.com/" || true
          python scripts/write-health.py oman --method cbonds-scrape --source-url "https://cbonds.com/indexes/189217/" || true
          python scripts/write-health.py gulf_ais --method aisstream --source-url "wss://stream.aisstream.io/v0/stream" || true
          python scripts/write-health.py hormuz_chart --method aisstream --source-url "wss://stream.aisstream.io/v0/stream" || true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data-market.json public/data-substitution.json src/data/hormuz.json public/health/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "data: update market + substitution $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase && git push
