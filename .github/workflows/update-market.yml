name: Update Market Data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Count Gulf ships (AIS)
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: |
          pip install websockets
          python scripts/count-gulf-ships.py > /tmp/gulf-ships.json || echo '{"ships":null,"tankers":null}' > /tmp/gulf-ships.json
          cat /tmp/gulf-ships.json

      - name: Fetch market data
        run: |
          pip install requests
          python - <<'PYEOF'
          import requests, json, time, os
          from datetime import datetime, timezone

          SYMBOLS = ["BZ=F", "CL=F", "NG=F", "2222.SR", "FRO", "STNG", "RTX", "LMT"]
          NAMES = {
              "BZ=F": "Brent Crude",
              "CL=F": "WTI Crude",
              "NG=F": "Natural Gas",
              "2222.SR": "Saudi Aramco",
              "FRO": "Frontline",
              "STNG": "Scorpio Tankers",
              "RTX": "RTX Corp",
              "LMT": "Lockheed Martin",
          }
          EIA_KEY = "SWpk1JtQ4j8iB6FAHUOnT1LS88T6uCHhTbeMJbgO"  # free rate-limited EIA key

          quotes = {}
          history = {}

          for sym in SYMBOLS:
              try:
                  # Quote data via v8 chart API (1d range, 1d interval = latest quote)
                  url = f"https://query1.finance.yahoo.com/v8/finance/chart/{sym}?range=1d&interval=1d"
                  headers = {"User-Agent": "Mozilla/5.0"}
                  r = requests.get(url, headers=headers, timeout=15)
                  r.raise_for_status()
                  chart = r.json()["chart"]["result"][0]
                  meta = chart["meta"]
                  price = meta.get("regularMarketPrice", 0)
                  prev = meta.get("chartPreviousClose", meta.get("previousClose", 0))
                  change = round(price - prev, 2)
                  change_pct = round((change / prev) * 100, 2) if prev else 0

                  quotes[sym] = {
                      "symbol": sym,
                      "name": NAMES.get(sym, sym),
                      "price": round(price, 2),
                      "change": change,
                      "changePercent": change_pct,
                      "previousClose": round(prev, 2),
                  }

                  # 30-day history via v8 chart API
                  hurl = f"https://query1.finance.yahoo.com/v8/finance/chart/{sym}?range=30d&interval=1d"
                  hr = requests.get(hurl, headers=headers, timeout=15)
                  hr.raise_for_status()
                  hchart = hr.json()["chart"]["result"][0]
                  timestamps = hchart.get("timestamp", [])
                  closes = hchart["indicators"]["quote"][0].get("close", [])
                  hist = []
                  for ts, c in zip(timestamps, closes):
                      if c is not None:
                          dt = datetime.fromtimestamp(ts, tz=timezone.utc).strftime("%Y-%m-%d")
                          hist.append({"date": dt, "close": round(c, 2)})
                  history[sym] = hist

                  time.sleep(0.5)
              except Exception as e:
                  print(f"Warning: failed to fetch {sym}: {e}")

          # Load existing data to preserve Dubai history
          import json as _json, os as _os
          existing_data = {}
          if _os.path.exists("public/data-market.json"):
              try:
                  with open("public/data-market.json") as _f:
                      existing_data = _json.load(_f)
              except:
                  pass
          # Dubai crude — scraped from oilprice.com (1-day delay, id=144), fallback to last known price
          dubai_existing_quote = existing_data.get("quotes", {}).get("DUBAI", {})
          dubai_history = existing_data.get("history", {}).get("DUBAI", [])
          try:
              import re as _re2, urllib.request as _ur2
              _req2 = _ur2.Request(
                  "https://oilprice.com/oil-price-charts/",
                  headers={"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36",
                           "Referer": "https://oilprice.com/"}
              )
              with _ur2.urlopen(_req2, timeout=15) as _r2:
                  _html2 = _r2.read().decode("utf-8", errors="ignore")
              _dubai_idx = _html2.find("data-name='Dubai'")
              if _dubai_idx < 0:
                  raise ValueError("Dubai not found in oilprice.com page")
              _dsnippet = _html2[_dubai_idx:_dubai_idx+600]
              _dprices = _re2.findall(r"data-price='([^']+)'", _dsnippet)
              if not _dprices:
                  raise ValueError("No Dubai price found")
              _dprice = round(float(_dprices[0]), 2)
              _dprev = dubai_existing_quote.get("price", _dprice)
              _dchange = round(_dprice - _dprev, 2)
              _dchange_pct = round((_dchange / _dprev) * 100, 2) if _dprev else 0
              quotes["DUBAI"] = {
                  "symbol": "DUBAI",
                  "name": "Dubai Crude",
                  "price": _dprice,
                  "change": _dchange,
                  "changePercent": _dchange_pct,
                  "previousClose": round(_dprev, 2),
                  "note": "Dubai crude — oilprice.com (1-day delay)",
                  "source": "oilprice.com",
              }
              from datetime import datetime as _dt3, timezone as _tz3
              _yesterday_iso2 = (_dt3.now(_tz3.utc) - __import__("datetime").timedelta(days=1)).strftime("%Y-%m-%d")
              _dubai_dates = {e["date"] for e in dubai_history}
              if _yesterday_iso2 not in _dubai_dates:
                  dubai_history.append({"date": _yesterday_iso2, "close": _dprice})
                  dubai_history.sort(key=lambda x: x["date"])
              history["DUBAI"] = dubai_history
              print(f"Dubai: scraped ${_dprice} from oilprice.com")
          except Exception as _e:
              print(f"Dubai scrape failed ({_e}), preserving last known price")
              if dubai_existing_quote:
                  quotes["DUBAI"] = dubai_existing_quote
              if dubai_history:
                  history["DUBAI"] = dubai_history

          # Oman crude — scraped from oilprice.com (1-day delay), fallback to last known price
          oman_existing_quote = existing_data.get("quotes", {}).get("OMAN", {})
          oman_history = existing_data.get("history", {}).get("OMAN", [])
          try:
              import re as _re, urllib.request as _ur
              _req = _ur.Request(
                  "https://oilprice.com/oil-price-charts/",
                  headers={"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36",
                           "Referer": "https://oilprice.com/"}
              )
              with _ur.urlopen(_req, timeout=15) as _r:
                  _html = _r.read().decode("utf-8", errors="ignore")
              _oman_idx = _html.find("DME-Oman")
              if _oman_idx < 0:
                  raise ValueError("DME-Oman not found in page")
              _snippet = _html[_oman_idx:_oman_idx+600]
              _prices = _re.findall(r"data-price='([^']+)'", _snippet)
              if not _prices:
                  raise ValueError("No price found for Oman")
              _price = round(float(_prices[0]), 2)
              _prev = oman_existing_quote.get("price", _price)
              _change = round(_price - _prev, 2)
              _change_pct = round((_change / _prev) * 100, 2) if _prev else 0
              quotes["OMAN"] = {
                  "symbol": "OMAN",
                  "name": "Oman Crude",
                  "price": _price,
                  "change": _change,
                  "changePercent": _change_pct,
                  "previousClose": round(_prev, 2),
                  "note": "DME Oman — oilprice.com (1-day delay)",
                  "source": "oilprice.com",
              }
              # Append today to Oman history
              from datetime import datetime as _dt2, timezone as _tz2
              _yesterday_iso = (_dt2.now(_tz2.utc) - __import__("datetime").timedelta(days=1)).strftime("%Y-%m-%d")
              _oman_dates = {e["date"] for e in oman_history}
              if _yesterday_iso not in _oman_dates:
                  oman_history.append({"date": _yesterday_iso, "close": _price})
                  oman_history.sort(key=lambda x: x["date"])
              history["OMAN"] = oman_history
              print(f"Oman: scraped ${_price} from oilprice.com")
          except Exception as _e:
              print(f"Oman scrape failed ({_e}), preserving last known price")
              if oman_existing_quote:
                  quotes["OMAN"] = oman_existing_quote
              if oman_history:
                  history["OMAN"] = oman_history

          # Load Gulf ship count from AIS step
          gulf_ships = {"ships": None, "tankers": None}
          try:
              with open("/tmp/gulf-ships.json") as _f:
                  gulf_ships = _json.load(_f)
          except:
              pass

          output = {
              "updated": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "quotes": quotes,
              "history": history,
              "gulf": {
                  "ships": gulf_ships.get("ships"),
                  "tankers": gulf_ships.get("tankers"),
                  "sampled_at": gulf_ships.get("sampled_at"),
              },
          }

          with open("public/data-market.json", "w") as f:
              json.dump(output, f, indent=2)

          print(f"Updated {len(quotes)} quotes, {len(history)} histories")
          PYEOF

      - name: Append AIS count to hormuz.json
        run: |
          python3 << 'PYEOF'
import json, os
from datetime import datetime, timezone

gulf_file = "/tmp/gulf-ships.json"
hormuz_file = "src/data/hormuz.json"

try:
    with open(gulf_file) as f:
        gulf = json.load(f)
    ships = gulf.get("ships")
    tankers = gulf.get("tankers", 0)
    if ships is None:
        print("No AIS data — skipping hormuz.json update")
        exit(0)
except Exception as e:
    print(f"Could not read gulf ships: {e}")
    exit(0)

today = datetime.now(timezone.utc).strftime("%Y-%m-%d")

with open(hormuz_file) as f:
    data = json.load(f)

existing_dates = {e["date"] for e in data}
if today in existing_dates:
    print(f"hormuz.json already has entry for {today} — skipping")
    exit(0)

data.append({
    "date": today,
    "ships": ships,
    "tankers": tankers,
    "oil_mbpd": 0.0,
    "status": "critical",
    "notes": f"AIS: {ships} vessels detected.",
    "tollPassage": True
})
data.sort(key=lambda x: x["date"])

with open(hormuz_file, "w") as f:
    json.dump(data, f, indent=2)

print(f"hormuz.json: added {today} — ships={ships}, tankers={tankers}")
PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data-market.json public/data-substitution.json src/data/hormuz.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "data: update market + substitution $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
