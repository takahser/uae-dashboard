name: Update Bond Market Data
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/fetch-bonds.js
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Write health timestamp
        run: |
          eval "$(python scripts/extract-health-values.py bonds)"
          python scripts/write-health.py bonds --method treasury-boe-mof --source-url "https://home.treasury.gov/" ${BONDS_OLD:+--old-value "$BONDS_OLD"} ${BONDS_NEW:+--new-value "$BONDS_NEW"}
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: update bond market yields"
